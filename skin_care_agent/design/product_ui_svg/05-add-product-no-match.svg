<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      .ui { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .primary { fill: #46502C; }
      .secondary { fill: #6E735D; }
      .action { fill: #71813C; }
    </style>
  </defs>

  <rect width="390" height="844" fill="#F8F0DD"/>
  <g class="ui primary" font-size="12" font-weight="700">
    <text x="22" y="28">20:19</text>
    <path d="M323 24c4.8-4.6 12.2-4.6 17 0M327 28c2.8-2.7 7.2-2.7 10 0" fill="none" stroke="#46502C" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="332" cy="31" r="1.3"/>
    <rect x="349" y="20" width="20" height="10" rx="3" fill="none" stroke="#46502C" stroke-width="1.5"/>
    <rect x="351.5" y="22.5" width="14" height="5" rx="1.5"/>
  </g>

  <g class="ui">
    <rect x="20" y="48" width="38" height="38" rx="19" fill="#FFFDF7" stroke="#DED8C6"/>
    <path d="M43 59l-9 8 9 8" fill="none" stroke="#46502C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="74" font-size="22" font-weight="700" class="primary">添加产品</text>
    <text x="20" y="111" font-size="12" class="secondary">输入得越完整，匹配结果越准确</text>
  </g>

  <g class="ui">

    <text x="58" y="617" font-size="14" font-weight="700" class="primary">无品牌修护油</text>
    <path d="M322 598l6 6-6 6" fill="none" stroke="#8D927A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="195" y="686" text-anchor="middle" font-size="10.5" class="secondary">自建产品不会自动绑定或合并到系统产品</text>

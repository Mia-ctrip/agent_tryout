    <rect x="20" y="157" width="350" height="52" rx="16" fill="#FFFDF7" stroke="#9BAD50" stroke-width="1.4"/>
    <circle cx="43" cy="183" r="7" fill="none" stroke="#71813C" stroke-width="1.6"/>
    <path d="M48 188l6 6" stroke="#71813C" stroke-width="1.6" stroke-linecap="round"/>
    <text x="65" y="188" font-size="14" font-weight="600" class="primary">无品牌修护油</text>
    <circle cx="346" cy="183" r="10" fill="#EDF1DF"/>
    <path d="M342 179l8 8M350 179l-8 8" stroke="#71813C" stroke-width="1.4" stroke-linecap="round"/>
    <text x="20" y="230" font-size="10.5" class="secondary">已完成名称、品牌、简称和受控别名匹配</text>
  </g>

  <g class="ui">
    <path d="M151 310c0-24 19-43 43-43h2c24 0 43 19 43 43v45h-88z" fill="#EDF1DF"/>
    <path d="M172 314h46v62h-46zM181 314v-14h28v14M178 337h34" fill="none" stroke="#71813C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="195" cy="355" r="7" fill="none" stroke="#9BAD50" stroke-width="1.6"/>
    <text x="195" y="418" text-anchor="middle" font-size="18" font-weight="700" class="primary">没有找到匹配产品</text>
    <text x="195" y="445" text-anchor="middle" font-size="11.5" class="secondary">可以沿用已输入的名称创建个人产品</text>
    <text x="195" y="464" text-anchor="middle" font-size="11.5" class="secondary">照片为可选项，也可以稍后补充</text>

    <rect x="42" y="498" width="306" height="52" rx="17" fill="#71813C"/>
